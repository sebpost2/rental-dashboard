services:
  - type: web
    name: rental-dashboard-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      # Postgres moved to Neon (Vercel Marketplace) — Render's free-tier
      # Postgres auto-deletes 30 days after creation, which kept breaking
      # the live demo. Set the Neon connection string manually in the
      # Render dashboard (Environment tab); it never expires on its own.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false
